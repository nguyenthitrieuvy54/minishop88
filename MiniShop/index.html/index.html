<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>Mini Shop</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
        <header class="bg-warning text-white p-3">
            <div class="container">
                <h2 class="text-center">MINI SHOP</h2>
            </div>
        </header>
        <nav class="bg-light p-3 text-center">
            <div class="container">
                <a href="#" class="me-3">Trang chủ</a>
                <a href="#sanpham">Sản phẩm</a>
            </div>
        </nav>
        <section class="container mt-4">
            <div class="bg-light p-5 text-center rounded">
                <h1>Chào mừng đến Mini Shop</h1>
                <p>Mua sắm dễ dàng - Giá tốt mỗi ngày</p>
                <a href="#sanpham" class="btn btn-warning">Xem sản phẩm</a>
            </div>
        </section>
        <section id="sanpham" class="container mt-4">
            <h2 class="text-center mb-4">Sản phẩm nổi bật</h2>
            <div class="row g-3">
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card h-100 shadow-sm" >
                        <img src="../images/sp1.png" class="card-img-top" alt="Áo thun">
                        <div class="card-body">
                            <h5 class="card-title">Áo thun</h5>
                            <p class="text-danger fw-bold">199.000&#8363;</p>
                            <a href="#" class="btn btn-warning">Mua ngay</a>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card h-100 shadow-sm">
                        <img src="../images/sp2.png" class="card-img-top" alt="Áo khoác">
                        <div class="card-body">
                            <h5 class="card-title">Áo khoác</h5>
                            <p class="text-danger fw-bold">250.000&#8363;</p>
                            <a href="#" class="btn btn-warning">Mua ngay</a>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card h-100 shadow-sm">
                        <img src="../images/sp3.png" class="card-img-top" alt="Áo sơ mi">
                        <div class="card-body">
                            <h5 class="card-title">Áo sơ mi</h5>
                            <p class="text-danger fw-bold">199.000&#8363;</p>
                            <a href="#" class="btn btn-warning">Mua ngay</a>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card h-100 shadow-sm">
                        <img src="../images/sp4.png" class="card-img-top" alt="Áo hai dây">
                        <div class="card-body">
                            <h5 class="card-title">Áo hai dây</h5>
                            <p class="text-danger fw-bold">150.000&#8363;</p>
                            <a href="#" class="btn btn-warning">Mua ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>
    <footer class="bg-dark text-white text-center p-3 mt-5">
        <div class="container">
            <p class="mb-0">
                &copy; 2026 Mini Shop - Thiết kế bằng Bootstrap 5
            </p>
        </div>
    </footer>
</html>
